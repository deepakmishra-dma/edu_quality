<html>
  <style>
    @page {
      size: 793.6px 265.92px;
      margin: 0;
    }
    @font-face {
      font-family: "Asap";
      src: url("/assets/edu_quality/fonts/Asap-Regular.ttf"); /* EOT file for IE */
    }
    @font-face {
      font-family: "Pachyderm";
      src: url("/assets/edu_quality/fonts/PACHYDER.TTF"); /* EOT file for IE */
    }
    @font-face {
      font-family: "Aksharyogini";
      src: url("/assets/edu_quality/fonts/AksharyoginiNormal.ttf"); /* EOT file for IE */
    }
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    .heading {
      margin-top: 9px;
      font-size: 18pt;
      font-family: "Pachyderm", "Aksharyogini";
    }
    .document {
      width: 100%;
      /* width: 2480px;
    height: 831px; */
      padding-left: 18.52px;
      padding-right: 18.24px;
    }
    .qr-code-image {
      height: 39.04px;
      width: 40.6px;
      margin-top: 38px;

      margin-bottom: 44px;
    }
    .qr-container {
      padding-left: 3.84px;
    }
    .rotated {
      position: absolute;
      writing-mode: tb-rl;
      transform: rotate(-90deg);
      transform-origin: center;
      translate: (-50%, -50%);
      left: -19%;
      font-size: 9pt;
      margin-top: 4px;
      font-family: "Asap";
    }
    /* .rotated {
    writing-mode: vertical-rl;
    transform: rotate(-180deg);
    font-size: 9pt;
    font-family: "Asap";
  } */
    .heading-space {
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
      flex-wrap: nowrap;
    }
    .rotated-container {
      position: relative;

      width: 126px;
    }
  </style>
  <body>
    <div class="document">
      <div class="heading-space">
        <h1 class="heading">{{subject_name}}</h1>
        <h1 class="heading">{{chapter_name}}</h1>
      </div>
      <div class="qr-container">
        <img src="{{ qr_code }}" class="qr-code-image" />
        <div class="rotated-container">
          <div class="rotated">{{ worksheet_name }}</div>
        </div>
      </div>
    </div>
  </body>
</html>
