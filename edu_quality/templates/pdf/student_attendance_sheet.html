<style>
  @page {
    size: A4 Landscape;
    margin: 20px;
    padding: 20px;
  }
  .table {
    width: 100%;
    max-width: 100%;
    margin-bottom: 1rem;
    color: #212529;
    border-collapse: collapse; /* Ensures borders are collapsed */
  }

  /* Equivalent of .table-bordered class */
  .table,
  .table th,
  .table td,
  .table td input {
    border: 1px solid #dee2e6; /* Light gray border */
    font-size: 0.65rem;
  }
  .no-spacing {
    border-spacing: 0;
    border-collapse: collapse;
  }

  .table tbody td {
    padding: 0.2rem !important;
    min-width: 15px !important;
    width: 15px !important;
  }

  .table thead th {
    white-space: nowrap;
    padding: 0.2rem !important;
  }

  .table td input {
    width: 10px !important;
    height: 10px !important;
    margin: auto;
  }
  .table td.holiday {
    display: none;
  }
</style>

{% for table in tables %}
<table class="page table" style="height: 210mm" cellspacing="0" cellpadding="0">
  <thead>
    <tr>
      {% for header in table.columns %}
      <th colspan="{{ header.colSpan }}">{{ header.textContent }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in table.rows %}
    <tr class="row-entry">
      {{ row }}
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endfor %}
